[project]
name = "dubai-property-analytics"
version = "0.1.0"
description = "Dubai real estate analytics: DLD Open Data → PostgreSQL pipeline, EDA and price modeling"
readme = "README.md"
authors = [
    { name = "CFF Macbook", email = "emir9596@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]>=3.3.8",
]

[project.scripts]
dubai-property-analytics = "dubai_property_analytics:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: need running Postgres (docker compose up -d)"]
addopts = "-m 'not integration'"
